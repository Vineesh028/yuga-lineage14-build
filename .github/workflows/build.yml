name: Build LineageOS 14.1 for yuga

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device codename"
        required: false
        default: "yuga"
      with_su:
        description: "Include built-in root (addonsu)"
        required: false
        default: "false"

jobs:
  build:
    name: lineage-14.1 yuga
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Disk + memory before
        run: |
          df -h
          free -h

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick liblz4-tool libssl-dev libxml2 \
            libxml2-utils lzop rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev python2.7 openjdk-8-jdk libncurses-dev libncurses5 libtinfo5
          sudo apt-get install -y pngcrush lib32z1-dev lib32readline-dev libsdl1.2-dev || true
          # AOSP 7.1 build scripts expect "python" == python2.7
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python2.7 1
          git lfs install --skip-repo

      - name: Configure git
        run: |
          git config --global user.name "lineage-builder"
          git config --global user.email "builder@localhost"
          git config --global color.ui false

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Init LineageOS 14.1
        run: |
          mkdir -p "$HOME/lineage"
          cd "$HOME/lineage"
          repo init -u https://github.com/LineageOS/android.git -b cm-14.1 \
            --git-lfs --no-clone-bundle --depth=1
          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE/local_manifests/yuga.xml" .repo/local_manifests/yuga.xml

      - name: Sync source
        run: |
          cd "$HOME/lineage"
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "=== repo sync attempt $attempt ==="
            if repo sync -c --no-tags --no-clone-bundle -j"$(nproc)" --force-sync --retry-fetches=5 --fail-fast; then
              ok=1; break
            fi
            echo "sync attempt $attempt failed; retrying in 20s..."
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "=== final sync attempt (no fail-fast) ==="
            repo sync -c --no-tags --no-clone-bundle -j"$(nproc)" --force-sync --retry-fetches=5 || exit 1
          fi

      - name: Disk after sync
        run: df -h

      - name: Patch device tree (AndroidProducts.mk + gps.conf conflict)
        run: |
          cd "$HOME/lineage"
          f=device/sony/yuga/AndroidProducts.mk
          if [ ! -f "$f" ]; then
            printf 'PRODUCT_MAKEFILES := $(LOCAL_DIR)/lineage.mk\n' > "$f"
            echo "created $f:"; cat "$f"
          else
            echo "$f already present:"; cat "$f"
          fi
          echo "--- AndroidProducts.mk files in device/ ---"
          find device -maxdepth 3 -name AndroidProducts.mk

          # system/etc/gps.conf is generated by BOTH the device-tree PRODUCT_COPY_FILES
          # and the hardware/qcom/gps "gps.conf" prebuilt module -> ninja "multiple rules
          # generate" error. Drop the copy and let the module install it, feeding it Sony's
          # tuned config. Make sure the module is actually built.
          GPSMK=device/sony/fusion3-common/product/gps.mk
          echo "--- before ---"; cat "$GPSMK"
          cat > "$GPSMK" <<'EOF'
          # GPS configurations (CI patch: gps.conf provided by the hardware/qcom/gps module)
          PRODUCT_PACKAGES += gps.conf
          EOF
          echo "--- after ---"; cat "$GPSMK"
          if [ -f device/sony/fusion3-common/gps/gps.conf ]; then
            cp device/sony/fusion3-common/gps/gps.conf hardware/qcom/gps/msm8960/etc/gps.conf
            echo "copied Sony gps.conf over hardware/qcom/gps/msm8960/etc/gps.conf"
          fi

      - name: Apply Nova customization overlay
        run: |
          cd "$HOME/lineage"
          OV="$GITHUB_WORKSPACE/overlay"
          NOVA=device/sony/yuga/nova
          mkdir -p "$NOVA/bin" "$NOVA/init.d" device/sony/yuga/product

          cp "$OV"/bin/*.sh       "$NOVA/bin/"
          cp "$OV"/init.d/90nova  "$NOVA/init.d/90nova"
          cp "$OV"/app/Nova.apk   "$NOVA/Nova.apk"
          cp "$OV"/app/Android.mk "$NOVA/Android.mk"
          cp "$OV"/etc/hosts      "$NOVA/hosts"

          # extend the privacy blocklist (best effort)
          if curl -fsSL --max-time 30 https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts -o /tmp/sb.hosts; then
            grep -E '^(0\.0\.0\.0|127\.0\.0\.1)[[:space:]]+' /tmp/sb.hosts \
              | grep -vi 'localhost' >> "$NOVA/hosts" || true
          fi
          echo "blocklist entries: $(grep -c -E '^0\.0\.0\.0' "$NOVA/hosts" || true)"

          # product fragment (auto-included by device.mk -> include product/*.mk)
          NOVAMK=device/sony/yuga/product/nova.mk
          {
            echo "# Nova customization overlay (auto-generated)"
            echo "PRODUCT_PACKAGES += Nova nova-boot nova-tune nova-health nova-diagnostics nova-automation nova-assistant 90nova"
            echo "PRODUCT_COPY_FILES += device/sony/yuga/nova/hosts:system/etc/hosts"
            while IFS= read -r line; do
              case "$line" in ''|\#*) continue ;; esac
              echo "PRODUCT_PROPERTY_OVERRIDES += $line"
            done < "$OV/system.prop"
          } > "$NOVAMK"

          echo "--- $NOVAMK ---"; cat "$NOVAMK"
          echo "--- nova files ---"; find "$NOVA" -type f | sort

      - name: Fix Jack server TLS (OpenJDK 8 disabled algorithms)
        run: |
          set +e
          JSS=/etc/java-8-openjdk/security/java.security
          echo "--- security dir ---"; ls -l /etc/java-8-openjdk/security/ || true
          echo "--- before ---"; grep -n "jdk.tls.disabledAlgorithms" "$JSS" || true
          sudo sed -i -E 's/TLSv1\.1(, )?//g; s/TLSv1(, )?//g' "$JSS"
          echo "--- after ---"; grep -n "jdk.tls.disabledAlgorithms" "$JSS" || true

      - name: Build ROM
        run: |
          cd "$HOME/lineage"
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          export ANDROID_JACK_VM_ARGS="-Dfile.encoding=UTF-8 -XX:+TieredCompilation -Xmx6g"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          [ "${{ github.event.inputs.with_su }}" = "true" ] && export WITH_SU=true || true
          source build/envsetup.sh
          set +e
          breakfast yuga
          brc=$?
          echo "breakfast rc=$brc"
          [ "$brc" -ne 0 ] && exit "$brc"
          echo "TARGET_PRODUCT=$TARGET_PRODUCT TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"
          echo "=== Prebuild resource package to avoid ninja ordering race on generated R.java/Manifest.java ==="
          mka org.cyanogenmod.platform-res -j"$(nproc)" 2>&1 | tail -20
          prc=${PIPESTATUS[0]}
          echo "prebuild platform-res rc=$prc"
          [ "$prc" -ne 0 ] && exit "$prc"
          echo "=== Full build ==="
          set -o pipefail
          mka bacon 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "mka bacon rc=$rc"
          exit $rc

      - name: Disk after build
        if: always()
        run: df -h

      - name: Upload ROM artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-14.1-yuga
          path: |
            /home/runner/lineage/out/target/product/yuga/*.zip
            /home/runner/lineage/out/target/product/yuga/recovery.img
            /home/runner/lineage/out/target/product/yuga/boot.img
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /home/runner/lineage/build.log
          if-no-files-found: ignore
          retention-days: 7
